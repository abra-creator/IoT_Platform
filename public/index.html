<body>

<header>
    <h1>IoT Platform Dashboard</h1>
    <p>ESP32 Sensor Monitoring System</p>
</header>

<div class="container">

```
<div class="device-card">

    <h2>Device: ESP32-Gate01</h2>

    <div class="sensor-grid">

        <div class="sensor-box">
            <h3>Distance</h3>
            <div class="value">
                <span id="distance">--</span> cm
            </div>
        </div>

        <div class="sensor-box">
            <h3>Device ID</h3>
            <div class="value" style="font-size:20px;">
                <span id="deviceId">--</span>
            </div>
        </div>

        <div class="sensor-box">
            <h3>Last Updated</h3>
            <div class="value" style="font-size:18px;">
                <span id="updated">--</span>
            </div>
        </div>

    </div>

    <div id="status" class="checking">
        ● Connecting to server...
    </div>

</div>
```

</div>

<script>

// Device is considered offline if no new data
// has been received for more than 30 seconds.
const OFFLINE_TIMEOUT = 30000;


function formatDateTime(dateString) {

    const date = new Date(dateString);

    if (isNaN(date.getTime())) {
        return "--";
    }

    return date.toLocaleString("en-TZ", {
        timeZone: "Africa/Dar_es_Salaam",
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    });
}


function updateDeviceStatus(createdAt) {

    const status = document.getElementById("status");

    const lastUpdate = new Date(createdAt);
    const now = new Date();

    const age = now.getTime() - lastUpdate.getTime();

    if (age <= OFFLINE_TIMEOUT) {

        status.textContent = "● Device Online";
        status.className = "online";

    } else {

        status.textContent = "● Device Offline";
        status.className = "offline";
    }
}


async function loadSensorData() {

    try {

        const response = await fetch("/api/devices/latest");

        if (!response.ok) {
            throw new Error("HTTP error " + response.status);
        }

        const result = await response.json();

        if (result.success && result.data) {

            document.getElementById("distance").textContent =
                result.data.distance;

            document.getElementById("deviceId").textContent =
                result.data.device_id;

            document.getElementById("updated").textContent =
                formatDateTime(result.data.created_at);

            updateDeviceStatus(result.data.created_at);

        } else {

            document.getElementById("status").textContent =
                "● No sensor data available";

            document.getElementById("status").className =
                "offline";
        }

    } catch (error) {

        console.error("Dashboard error:", error);

        document.getElementById("status").textContent =
            "● Server connection failed";

        document.getElementById("status").className =
            "offline";
    }
}


// Load immediately
loadSensorData();


// Check server every 2 seconds
setInterval(loadSensorData, 2000);

</script>

</body>
</html>
