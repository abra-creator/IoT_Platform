<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IoT Platform Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .device-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .device-card h2 {
            margin-top: 0;
        }

        .sensor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .sensor-box {
            background: #f9fafb;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            border: 1px solid #e5e7eb;
        }

        .sensor-box h3 {
            margin: 0 0 10px;
            color: #6b7280;
        }

        .value {
            font-size: 28px;
            font-weight: bold;
            color: #111827;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

        .online {
            color: green;
        }

        .offline {
            color: red;
        }
    </style>
</head>

<body>

<header>
    <h1>IoT Platform Dashboard</h1>
    <p>ESP32 Sensor Monitoring System</p>
</header>

<div class="container">

    <div class="device-card">

        <h2>Device: ESP32-Gate01</h2>

        <div class="sensor-grid">

            <div class="sensor-box">
                <h3>Distance</h3>
                <div class="value">
                    <span id="distance">--</span> cm
                </div>
            </div>

            <div class="sensor-box">
                <h3>Device ID</h3>
                <div class="value" style="font-size:20px;">
                    <span id="deviceId">--</span>
                </div>
            </div>

            <div class="sensor-box">
                <h3>Last Updated</h3>
                <div class="value" style="font-size:18px;">
                    <span id="updated">--</span>
                </div>
            </div>

        </div>

        <div id="status" class="offline">
            Connecting to server...
        </div>

    </div>

</div>

<script>

async function loadSensorData() {

    try {

        const response = await fetch("/api/devices/latest");

        const result = await response.json();

        if (result.success && result.data) {

            document.getElementById("distance").textContent =
                result.data.distance;

            document.getElementById("deviceId").textContent =
                result.data.device_id;

            document.getElementById("updated").textContent =
                result.data.created_at;

            const status = document.getElementById("status");

            status.textContent = "● Device Online";
            status.className = "online";

        } else {

            document.getElementById("status").textContent =
                "● No sensor data available";

            document.getElementById("status").className = "offline";
        }

    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "● Server connection failed";

        document.getElementById("status").className = "offline";
    }
}


// Load immediately
loadSensorData();


// Refresh every 2 seconds
setInterval(loadSensorData, 2000);

</script>

</body>
</html>
